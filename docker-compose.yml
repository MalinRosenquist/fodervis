services:
  postgres:
    image: postgres:15
    container_name: fodervis-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fodervis
    ports:
      - "5432:5432"
    volumes:
      - fodervis-db-data:/var/lib/postgresql/data

volumes:
  fodervis-db-data:
